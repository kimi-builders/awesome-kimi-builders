name: awesome-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # README ordering uses full history
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/build-readme.mjs --check
      - run: node scripts/build-catalog.mjs --check
      - run: node --test scripts/catalog.test.mjs
